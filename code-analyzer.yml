log_folder: code-analyzer/logs

ignores:
  files:
    - "code-analyzer/**"
    - "coverage/**"
    - "**/dist/**"
    - "reports/**"
    - "releases/**"
    - "test-results/**"
    - "playwright-report/**"

suppressions:
  "packages/record-health-check/force-app/main/default/objects/Record_Health_Check_Readiness__c/fields/PassCount__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "This private readiness Number field counts passed Checks; it contains no password, token, credential, or authentication material."
  "packages/record-health-check/force-app/main/default/objects/Record_Health_Check_Set__mdt/fields/PassedChecksDisplay__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "This public Custom Metadata field controls passed-result display; it never stores a password, token, credential, or authentication material."
  "packages/record-health-check/force-app/main/default/objects/Record_Health_Check__mdt/fields/PassConditionFormula__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "This public Custom Metadata field stores a Salesforce formula whose name begins with Pass; it never stores authentication material."
  "packages/record-health-check/integration-tests/main/default/objects/RHC_Benchmark_Result__c/fields/Passed__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "This integration-only numeric benchmark count records passed checks; it is not packaged and contains no authentication material."
  "packages/record-health-check/integration-tests/main/default/objects/RHC_Persona_Record__c/fields/Accessible_Value__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "This integration-only synthetic accessible-value fixture exists to test FLS boundaries; it is not packaged or secret-bearing."
  "packages/record-health-check/integration-tests/main/default/flows/RHC_Release_Matrix.flow-meta.xml":
    - rule_selector: "flow:MissingDescription"
      max_suppressed_violations: 24
      reason: "The Flow engine flags invocable action input/output parameter nodes, but the Salesforce Flow metadata schema provides no description field on those nodes; all describable Flow elements and variables are documented."
  "subscriber-app/main/default/flows/RHC_Subscriber_Release_Matrix.flow-meta.xml":
    - rule_selector: "flow:MissingDescription"
      max_suppressed_violations: 19
      reason: "The Flow engine flags invocable action input/output parameter nodes, but the Salesforce Flow metadata schema provides no description field on those nodes; all describable Flow elements and variables are documented."

engines:
  eslint:
    eslint_config_file: eslint.config.js
    disable_javascript_base_config: true
    disable_lwc_base_config: true
    disable_slds_base_config: true

rules:
  pmd:
    # Subscriber-facing Apex in a managed package must be global. Public would
    # make these contracts inaccessible outside the package namespace.
    AvoidGlobalModifier:
      disabled: true
    # The neutral audit remains visible in the release evidence. PMD cannot
    # distinguish subscriber-facing contracts from internal/test helpers, so
    # requiring this check would encourage hundreds of low-value comments.
    ApexDoc:
      disabled: true
    ApexUnitTestClassShouldHaveRunAs:
      disabled: true
    ApexUnitTestClassShouldHaveAsserts:
      disabled: true
    AvoidDebugStatements:
      disabled: true
    ExcessiveParameterList:
      disabled: true
    CyclomaticComplexity:
      disabled: true
    CognitiveComplexity:
      disabled: true
    NcssCount:
      disabled: true
    AvoidDeeplyNestedIfStmts:
      disabled: true
    ExcessivePublicCount:
      disabled: true
    AvoidBooleanMethodParameters:
      disabled: true
    TooManyFields:
      disabled: true
  cpd:
    DetectCopyPasteForJavascript:
      disabled: true
    DetectCopyPasteForApex:
      disabled: true
