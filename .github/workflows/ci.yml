name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global @salesforce/cli@2.150.6
      - run: npm ci
      - run: npm ci --prefix packages/record-health-check-mcp
      - name: Audit shipped Node dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check:toolchain-policy
      - run: npm run prettier:verify
      - run: npm run lint
      - run: npm run lint:slds
      - run: npm run check:namespaced-tokens
      - run: npm run check:configuration-identity
      - run: npm run check:lightning-runtime-compatibility
      - run: npm run check:hosted-validation:self-test
      - run: npm run check:release-gate-parity
      - run: npm run check:release-runtime-matrix
      - run: npm run check:dependency-security
      - run: npm run check:agent-tool-contract
      - run: npm run check:mcp
      - run: npm run check:test-data-factory
      - run: npm run check:test-data-factory-inventory
      - run: npm run check:apex-architecture
      - run: npm run check:apex-surface
      - run: npm run check:code-analyzer-output-paths
      - run: npm run check:code-analyzer-suppressions
      - run: npm run check:code-analyzer-inline-suppressions
      - run: npm run check:plugin-sharing
      - run: npm run check:version-sync
      - run: npm run check:product-version-language
      - run: npm run check:docs
      - run: npm run check:field-limits
      - run: npm run check:manifest
      - run: npm run check:package-artifact
      - run: npm run check:package-boundary
      - run: npm run check:query-shapes
      - run: npm run check:distribution-boundary
      - run: npm run check:permission-sets
      - run: npm run check:xml
      - run: npm run test:scripts
      - run: npm run test:unit:coverage
      - run: npm run check:quality-metrics
