name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:toolchain-policy
      - run: npm run prettier:verify
      - run: npm run lint
      - run: npm run lint:slds
      - run: npm run check:namespaced-tokens
      - run: npm run check:configuration-identity
      - run: npm run check:test-data-factory
      - run: npm run check:apex-architecture
      - run: npm run check:apex-surface
      - run: npm run check:code-analyzer-output-paths
      - run: npm run check:plugin-sharing
      - run: npm run check:version-sync
      - run: npm run check:product-version-language
      - run: npm run check:docs
      - run: npm run check:field-limits
      - run: npm run check:manifest
      - run: npm run check:package-boundary
      - run: npm run check:query-shapes
      - run: npm run check:distribution-boundary
      - run: npm run check:permission-sets
      - run: npm run test:unit:coverage
      - run: npm run check:quality-metrics
      - name: Validate XML
        run: python3 -c "import pathlib,xml.etree.ElementTree as ET; [ET.parse(p) for root in ('packages/record-health-check/force-app','packages/record-health-check/integration-tests','packages/record-health-check/manifest','subscriber-app') for p in pathlib.Path(root).rglob('*.xml')]"
