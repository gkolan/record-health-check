name: Salesforce release gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salesforce-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-dev-hub-secret:
    runs-on: ubuntu-latest
    outputs:
      has-secret: ${{ steps.check.outputs.has-secret }}
    steps:
      - id: check
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          if [ -z "${SFDX_AUTH_URL}" ]; then
            echo "::warning::SFDX_AUTH_URL secret is not configured. Skipping the Salesforce release gate (org deploy and Apex tests will not run)."
            echo "has-secret=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-secret=true" >> "$GITHUB_OUTPUT"
          fi

  package-source-tests:
    needs: check-dev-hub-secret
    if: needs.check-dev-hub-secret.outputs.has-secret == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint Lightning JavaScript
        run: npm run lint
      - name: Validate SLDS 1 and SLDS 2 styles
        run: npm run lint:slds
      - name: Verify package manifest covers all Framework metadata
        run: npm run check:manifest
      - name: Verify Framework and fixture package boundary
        run: npm run check:package-boundary
      - name: Verify query-shape inventory
        run: npm run check:query-shapes
      - name: Enforce Apex architecture and test-only access policy
        run: npm run check:apex-architecture
      - name: Verify documentation contracts
        run: npm run check:docs
      - name: Verify namespaced tokens
        run: npm run check:namespaced-tokens
      - name: Verify exact configuration identity contract
        run: npm run check:configuration-identity
      - name: Verify package version synchronization
        run: npm run check:version-sync
      - name: Verify field limits
        run: npm run check:field-limits
      - name: Verify permission-set limits and access contracts
        run: npm run check:permission-sets
      - run: npm install --global @salesforce/cli@2.148.3
      - run: npm run check:toolchain
      - run: echo y | sf plugins install code-analyzer@5.14.0
      - name: Record analyzer toolchain versions
        run: |
          sf --version
          sf plugins --core
      - name: Authenticate Dev Hub
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" | sf org login sfdx-url --sfdx-url-stdin --alias devhub --set-default-dev-hub
      - name: Check scratch-org capacity
        run: npm run check:scratch-capacity -- --dev-hub devhub
      - name: Create namespaced package-source scratch org
        working-directory: packages/record-health-check
        run: sf org create scratch --definition-file config/project-scratch-def.json --alias rhc-ci --set-default --duration-days 30 --wait 15
      - name: Dry-run production package deployment
        working-directory: packages/record-health-check
        # Check-only tests run before a newly validated Custom Permission is
        # committed. Validate metadata here, then run every local test in the
        # real isolated-scratch deployment immediately below.
        run: sf project deploy start --manifest manifest/package.xml --target-org rhc-ci --test-level NoTestRun --dry-run --wait 30
      - name: Deploy production package artifact
        working-directory: packages/record-health-check
        run: sf project deploy start --manifest manifest/package.xml --target-org rhc-ci --test-level NoTestRun --wait 30
      - name: Assign package permissions before Apex tests
        run: sf org assign permset --name Record_Health_Check_Admin --target-org rhc-ci
      - name: Run production package Apex tests
        run: sf apex run test --target-org rhc-ci --test-level RunLocalTests --code-coverage --wait 30 --result-format human
      - name: Dry-run integration harness deployment
        working-directory: packages/record-health-check
        run: |
          source_args=()
          while IFS= read -r -d '' directory; do
            source_args+=(--source-dir "$directory")
          done < <(find integration-tests/main/default -mindepth 1 -maxdepth 1 -type d ! -name testSuites -print0)
          sf project deploy start "${source_args[@]}" --target-org rhc-ci --test-level NoTestRun --dry-run --wait 30
      - name: Deploy integration fixtures and fixture-dependent tests
        working-directory: packages/record-health-check
        run: |
          source_args=()
          while IFS= read -r -d '' directory; do
            source_args+=(--source-dir "$directory")
          done < <(find integration-tests/main/default -mindepth 1 -maxdepth 1 -type d ! -name testSuites -print0)
          sf project deploy start "${source_args[@]}" --target-org rhc-ci --test-level NoTestRun --wait 30
      - run: sf apex run test --target-org rhc-ci --test-level RunLocalTests --code-coverage --wait 30 --result-format human
      - name: Enforce production Apex coverage class by class
        run: npm run check:apex-coverage -- rhc-ci --list
      - name: Verify published Apex and LWC coverage statistics
        run: npm run test:unit:coverage && npm run check:quality-metrics -- --apex-org rhc-ci
      - name: Verify bounded query behavior against the accepted baseline
        run: npm run check:query-verdicts -- --target-org rhc-ci --namespace rhc
      - name: Run metadata validator
        run: sf apex run --target-org rhc-ci --file scripts/apex/validateMetadata.apex
      # Run static analysis last. The blocking release-policy profile documents
      # package-specific check decisions; every enabled finding fails CI. The
      # separate neutral audit runs every check as advisory debt evidence.
      - name: Enforce Code Analyzer output locations
        run: npm run check:code-analyzer-output-paths
      - name: Run blocking Code Analyzer release-policy gate
        run: |
          mkdir -p code-analyzer/logs
          sf code-analyzer run --workspace packages/record-health-check/force-app --workspace packages/record-health-check/integration-tests --rule-selector Recommended --include-fixes --output-file code-analyzer/release-profile.json --output-file code-analyzer/release-profile.html --severity-threshold 5
      - name: Run all-checks neutral advisory debt audit
        if: always()
        continue-on-error: true
        run: |
          sf code-analyzer run --workspace packages/record-health-check/force-app --workspace packages/record-health-check/integration-tests --config-file code-analyzer-neutral.yml --rule-selector all --include-fixes --output-file code-analyzer/neutral-audit.json --output-file code-analyzer/neutral-audit.html
      - name: Upload Code Analyzer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-evidence
          path: |
            code-analyzer/release-profile.json
            code-analyzer/release-profile.html
            code-analyzer/neutral-audit.json
            code-analyzer/neutral-audit.html
            code-analyzer/logs/
          retention-days: 90
      - name: Delete scratch org
        if: always()
        continue-on-error: true
        run: |
          if ! command -v sf >/dev/null 2>&1; then
            echo "sf CLI was never installed; skipping scratch org cleanup"
            exit 0
          fi
          if sf org display --target-org rhc-ci >/dev/null 2>&1; then
            sf org delete scratch --target-org rhc-ci --no-prompt
          else
            echo "No rhc-ci scratch org authorization found; skipping cleanup"
          fi

  portable-source-tests:
    needs: [check-dev-hub-secret, package-source-tests]
    if: needs.check-dev-hub-secret.outputs.has-secret == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --global @salesforce/cli@2.148.3
      - run: npm run check:toolchain
      - name: Authenticate Dev Hub
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" | sf org login sfdx-url --sfdx-url-stdin --alias devhub --set-default-dev-hub
      - name: Check scratch-org capacity
        run: npm run check:scratch-capacity -- --dev-hub devhub
      - name: Create clean no-namespace scratch org
        working-directory: packages/record-health-check
        run: sf org create scratch --definition-file ../../config/subscriber-scratch-def.json --alias rhc-ci-portable --target-dev-hub devhub --duration-days 30 --no-namespace --wait 15
      - name: Deploy portable package source and run Apex tests
        working-directory: packages/record-health-check
        run: |
          sf project deploy start --source-dir force-app --target-org rhc-ci-portable --test-level NoTestRun --wait 30
          sf org assign permset --name Record_Health_Check_Admin --target-org rhc-ci-portable
          sf apex run test --target-org rhc-ci-portable --test-level RunLocalTests --code-coverage --wait 30 --result-format human
      - name: Enforce portable-source Apex coverage class by class
        run: npm run check:apex-coverage -- rhc-ci-portable --list
      - name: Delete no-namespace scratch org
        if: always()
        continue-on-error: true
        run: |
          if ! command -v sf >/dev/null 2>&1; then
            echo "sf CLI was never installed; skipping scratch org cleanup"
            exit 0
          fi
          if sf org display --target-org rhc-ci-portable >/dev/null 2>&1; then
            sf org delete scratch --target-org rhc-ci-portable --no-prompt
          else
            echo "No rhc-ci-portable scratch org authorization found; skipping cleanup"
          fi
