name: MCP artifact

on:
  pull_request:
    paths:
      - "packages/record-health-check-mcp/**"
      - ".github/workflows/mcp-artifact.yml"
  push:
    branches: [main]
    paths:
      - "packages/record-health-check-mcp/**"
      - ".github/workflows/mcp-artifact.yml"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build immutable test image
        uses: docker/build-push-action@v7
        with:
          context: packages/record-health-check-mcp
          load: true
          push: false
          tags: record-health-check-mcp:${{ github.sha }}
      - name: Verify native vulnerability reachability assumptions
        env:
          IMAGE: record-health-check-mcp:${{ github.sha }}
        run: |
          runtime=$(mktemp -d)
          container=$(docker create "$IMAGE")
          trap 'docker rm "$container" >/dev/null; rm -rf "$runtime"' EXIT
          docker cp "$container":/nodejs/bin/node "$runtime/node"
          docker cp "$container":/usr/lib/x86_64-linux-gnu "$runtime/libraries"
          objdump -d --disassemble=_ZnwmSt11align_val_t "$runtime/libraries/libstdc++.so.6.0.33" > "$runtime/aligned-new.txt"
          grep -q 'call.*posix_memalign' "$runtime/aligned-new.txt"
          ! grep -q 'call.*aligned_alloc' "$runtime/aligned-new.txt"
          objdump -T "$runtime/node" > "$runtime/symbols.txt"
          find "$runtime/libraries" -type f -name '*.so*' -exec objdump -T {} + >> "$runtime/symbols.txt"
          ! grep -E '\*UND\*.*(__)?strfmon(_l)?([[:space:]]|$)' "$runtime/symbols.txt"
          ! grep -q '__gnu_pbds' "$runtime/symbols.txt"
          docker run --rm "$IMAGE" -e 'try { process.dlopen({}, "/missing.node"); process.exit(1); } catch (error) { if (error.code !== "ERR_DLOPEN_DISABLED") throw error; }'
      - name: Scan container for high-severity vulnerabilities
        id: container-scan
        uses: anchore/scan-action@v7
        with:
          image: record-health-check-mcp:${{ github.sha }}
          config: packages/record-health-check-mcp/grype.yaml
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: mcp-container-scan.json
      - name: Upload container scan findings
        if: ${{ always() && (steps.container-scan.outcome == 'success' || steps.container-scan.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: mcp-container-scan-${{ github.sha }}
          path: mcp-container-scan.json
          if-no-files-found: error
          retention-days: 30
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: record-health-check-mcp:${{ github.sha }}
          format: spdx-json
          output-file: record-health-check-mcp.spdx.json
      - name: Export tested image
        run: docker save --output record-health-check-mcp.tar record-health-check-mcp:${{ github.sha }}
      - name: Record artifact digests
        run: sha256sum record-health-check-mcp.tar record-health-check-mcp.spdx.json > artifact-digests.txt
      - name: Attest image archive
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: record-health-check-mcp.tar
      - name: Upload verification evidence
        uses: actions/upload-artifact@v6
        with:
          name: record-health-check-mcp-${{ github.sha }}
          path: |
            artifact-digests.txt
            record-health-check-mcp.tar
            record-health-check-mcp.spdx.json
          if-no-files-found: error
          retention-days: 30
