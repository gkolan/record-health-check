name: Subscriber release-pair validation
run-name: Subscriber release pair · ${{ inputs.package_version_id }}

on:
  workflow_dispatch:
    inputs:
      package_version_id:
        description: Candidate 04t to validate; required before promotion
        required: true
        type: string
      authorize_scratch_org_creation:
        description: I authorize this release to create its retained LWS and Locker org pair
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: salesforce-devhub-release
  cancel-in-progress: false

jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/record-health-check-mcp
      - run: npm install --global @salesforce/cli@2.150.6
      - run: npm run check:toolchain
      - name: Complete all no-org release checks before spending quota
        run: npm run release:preflight
      - name: Verify browser installation before spending quota
        run: npx playwright install --with-deps chromium firefox

  require-dev-hub-secret:
    needs: offline-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit scratch-org authorization
        if: inputs.authorize_scratch_org_creation != true
        run: |
          echo "::error::Scratch-org creation was not explicitly authorized for this workflow run."
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require hosted Salesforce credentials
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          if [ -z "${SFDX_AUTH_URL}" ]; then
            echo "::error::SFDX_AUTH_URL is required. Subscriber validation must fail, never pass by skipping live package tests."
            exit 1
          fi
      - name: Install pinned Salesforce CLI for Dev Hub preflight
        run: npm install --global @salesforce/cli@2.150.6
      - name: Authenticate Dev Hub
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          auth_file="$RUNNER_TEMP/devhub-auth-url.txt"
          trap 'rm -f "$auth_file"' EXIT
          printf '%s' "$SFDX_AUTH_URL" > "$auth_file"
          chmod 600 "$auth_file"
          sf org login sfdx-url --sfdx-url-file "$auth_file" --alias devhub --set-default-dev-hub
      - name: Check subscriber-stage scratch-org capacity
        run: npm run check:scratch-capacity -- --dev-hub devhub --required 2

  subscriber-release-pair:
    name: subscriber-release-pair (${{ matrix.security_mode }})
    needs: require-dev-hub-secret
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - security_mode: LWS
            artifact_suffix: lws
          - security_mode: Locker
            artifact_suffix: locker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/record-health-check-mcp
      - run: npx playwright install --with-deps chromium firefox
      - run: npm install --global @salesforce/cli@2.150.6
      - run: npm run check:toolchain
      - name: Resolve explicit candidate and tracked upgrade base
        id: rhc-package
        shell: bash
        env:
          CANDIDATE_PACKAGE_ID: ${{ inputs.package_version_id }}
        run: |
          package_id="$CANDIDATE_PACKAGE_ID"
          upgrade_from="$(node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("config/release-runtime-matrix.json")); const b=m.upgradeBases.find((entry)=>entry.version===m.upgradeFromVersion); if(!b) process.exit(1); process.stdout.write(b.subscriberPackageVersionId)')"
          release_alias="$(node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("config/release-runtime-matrix.json")).candidateVersion.split(".").slice(0,3).join("-"); process.stdout.write(v)')"
          if [[ ! "$package_id" =~ ^04t[[:alnum:]]{12}([[:alnum:]]{3})?$ ]]; then
            echo "::error::Candidate package version is not a 15- or 18-character 04t ID."
            exit 1
          fi
          {
            printf 'id=%s\n' "$package_id"
            printf 'upgrade_from=%s\n' "$upgrade_from"
            printf 'release_alias=%s\n' "$release_alias"
          } >> "$GITHUB_OUTPUT"
      - name: Authenticate Dev Hub
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          auth_file="$RUNNER_TEMP/devhub-auth-url.txt"
          trap 'rm -f "$auth_file"' EXIT
          printf '%s' "$SFDX_AUTH_URL" > "$auth_file"
          chmod 600 "$auth_file"
          sf org login sfdx-url --sfdx-url-file "$auth_file" --alias devhub --set-default-dev-hub
      - name: Clean install, reset, and exact upgrade in the retained release org
        env:
          DEV_HUB_ALIAS: devhub
        run: npm run package:verify -- --package "${{ steps.rhc-package.outputs.id }}" --upgrade-from "${{ steps.rhc-package.outputs.upgrade_from }}" --alias "rhc-${{ steps.rhc-package.outputs.release_alias }}-${{ matrix.artifact_suffix }}" --security-mode "${{ matrix.security_mode }}" --release-pair --keep-org
      - name: Upload clean-install and upgrade browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: subscriber-release-pair-browser-${{ matrix.artifact_suffix }}-${{ inputs.package_version_id }}
          path: |
            playwright-report/
            test-results/browser/
          if-no-files-found: error
          retention-days: 90

      - name: Upload reconciled subscriber Apex inventory
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: subscriber-release-pair-apex-${{ matrix.artifact_suffix }}-${{ inputs.package_version_id }}
          path: test-results/apex/
          if-no-files-found: error
          retention-days: 90

      - name: Upload subscriber configuration preservation proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: subscriber-release-pair-preservation-${{ matrix.artifact_suffix }}-${{ inputs.package_version_id }}
          path: packages/record-health-check/.package-evidence/*-upgrade-preservation.json
          # This exact test-evidence path is hidden; do not widen the upload scope.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
