name: Subscriber validation
run-name: Subscriber validation · ${{ inputs.package_version_id }}

on:
  workflow_dispatch:
    inputs:
      package_version_id:
        description: Candidate 04t to validate; required before promotion
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: subscriber-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  require-dev-hub-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Require hosted Salesforce credentials
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          if [ -z "${SFDX_AUTH_URL}" ]; then
            echo "::error::SFDX_AUTH_URL is required. Subscriber validation must fail, never pass by skipping live package tests."
            exit 1
          fi

  subscriber-clean-install:
    needs: require-dev-hub-secret
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - security_mode: LWS
            alias: rhc-ci-subscriber-lws
            artifact_suffix: lws
          - security_mode: Locker
            alias: rhc-ci-subscriber-locker
            artifact_suffix: locker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/record-health-check-mcp
      - run: npx playwright install --with-deps chromium firefox
      - run: npm install --global @salesforce/cli@2.149.9
      - run: npm run check:toolchain
      - name: Validate explicit candidate package version
        id: rhc-package
        shell: bash
        run: |
          package_id="${{ inputs.package_version_id }}"
          if [[ ! "$package_id" =~ ^04t[[:alnum:]]{12}([[:alnum:]]{3})?$ ]]; then
            echo "::error::Candidate package version is not a 15- or 18-character 04t ID."
            exit 1
          fi
          printf 'id=%s\n' "$package_id" >> "$GITHUB_OUTPUT"
      - name: Authenticate Dev Hub
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" | sf org login sfdx-url --sfdx-url-stdin --alias devhub --set-default-dev-hub
      - name: Clean subscriber install and smoke test
        env:
          DEV_HUB_ALIAS: devhub
          RHC_SKIP_DEMO_DATA: "1"
        run: npm run package:verify -- --package "${{ steps.rhc-package.outputs.id }}" --alias "${{ matrix.alias }}" --security-mode "${{ matrix.security_mode }}" --skip-upgrade
      - name: Upload clean-install browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subscriber-clean-install-${{ matrix.artifact_suffix }}-${{ inputs.package_version_id }}
          path: |
            playwright-report/
            test-results/browser/
          if-no-files-found: error
          retention-days: 90

  subscriber-upgrade:
    needs: require-dev-hub-secret
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - security_mode: LWS
            alias: rhc-ci-upgrade-lws
            artifact_suffix: lws
          - security_mode: Locker
            alias: rhc-ci-upgrade-locker
            artifact_suffix: locker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/record-health-check-mcp
      - run: npx playwright install --with-deps chromium firefox
      - run: npm install --global @salesforce/cli@2.149.9
      - run: npm run check:toolchain
      - name: Resolve explicit candidate and tracked upgrade base
        id: rhc-package
        shell: bash
        run: |
          package_id="${{ inputs.package_version_id }}"
          upgrade_from="$(node --input-type=module -e 'import { stablePackageVersionId } from "./scripts/lib/package-releases.mjs"; process.stdout.write(stablePackageVersionId())')"
          if [[ ! "$package_id" =~ ^04t[[:alnum:]]{12}([[:alnum:]]{3})?$ ]]; then
            echo "::error::Candidate package version is not a 15- or 18-character 04t ID."
            exit 1
          fi
          printf 'id=%s\n' "$package_id" >> "$GITHUB_OUTPUT"
          printf 'upgrade_from=%s\n' "$upgrade_from" >> "$GITHUB_OUTPUT"
      - name: Authenticate Dev Hub
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" | sf org login sfdx-url --sfdx-url-stdin --alias devhub --set-default-dev-hub
      - name: Exact subscriber upgrade gate
        env:
          DEV_HUB_ALIAS: devhub
        run: npm run package:verify -- --package "${{ steps.rhc-package.outputs.id }}" --upgrade-from "${{ steps.rhc-package.outputs.upgrade_from }}" --alias "${{ matrix.alias }}" --security-mode "${{ matrix.security_mode }}" --upgrade-only
      - name: Upload upgrade preservation and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subscriber-upgrade-evidence-${{ matrix.artifact_suffix }}-${{ inputs.package_version_id }}
          path: |
            packages/record-health-check/.package-evidence/*-upgrade-preservation.json
            playwright-report/
            test-results/browser/
          if-no-files-found: error
          retention-days: 90
